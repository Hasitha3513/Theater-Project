spring.application.name=cinenest
spring.datasource.url=${CINENEST_DB_URL}
spring.datasource.username=${CINENEST_DB_USER}
spring.datasource.password=${CINENEST_DB_PASSWORD}
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
server.address=127.0.0.1
server.port=${CINENEST_HTTP_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.main.banner-mode=off
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Explicitly opt in only with local-synthetic. Real customer registration is never admitted.
cinenest.identity.enabled=${CINENEST_LOCAL_CUSTOMER_AUTH:false}
cinenest.identity.manual.enabled=${CINENEST_LOCAL_CUSTOMER_AUTH:false}
cinenest.identity.manual.outbox=${CINENEST_LOCAL_TEST_OUTBOX:}
cinenest.identity.session-timeout-seconds=${CINENEST_LOCAL_SESSION_SECONDS:0}
cinenest.identity.manual.attempt-limit=${CINENEST_LOCAL_AUTH_ATTEMPT_LIMIT:5}
cinenest.identity.manual.window-seconds=${CINENEST_LOCAL_AUTH_WINDOW_SECONDS:900}
cinenest.identity.manual.verification-seconds=${CINENEST_LOCAL_VERIFICATION_SECONDS:900}

# Owner-only local profile editing;no production admission or grants.
cinenest.identity.profile.enabled=${CINENEST_LOCAL_CUSTOMER_PROFILE:false}

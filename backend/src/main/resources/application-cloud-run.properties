# Explicit deployment profile. Existing local profiles and application defaults stay unchanged.
server.address=${CINENEST_BIND_ADDRESS:127.0.0.1}
server.port=${PORT}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
logging.structured.format.console=logstash
spring.datasource.hikari.maximum-pool-size=${CINENEST_DB_POOL_MAX}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=120000
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# OFFLINE TEMPLATE ONLY. Not deployable until placeholders, IAM and release gates are approved.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: __APPROVED_SERVICE_NAME__
  namespace: '980464067041'
  labels:
    cloud.googleapis.com/location: us-east1
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/container-dependencies: '{"frontend":["backend"]}'
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"__APPROVED_EXISTING_SUBNET__"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
        autoscaling.knative.dev/maxScale: '__APPROVED_MAX_INSTANCES__'
    spec:
      serviceAccountName: __APPROVED_RUNTIME_SERVICE_ACCOUNT__
      containerConcurrency: __APPROVED_CONCURRENCY__
      containers:
        - name: frontend
          image: __APPROVED_FRONTEND_IMAGE_AT_SHA256__
          ports:
            - containerPort: 8080
          env:
            - name: CINENEST_AUTH_ORIGIN
              value: http://127.0.0.1:8081
            - name: HOSTNAME
              value: 0.0.0.0
          startupProbe:
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
          resources:
            limits:
              cpu: '__APPROVED_FRONTEND_CPU__'
              memory: __APPROVED_FRONTEND_MEMORY__
        - name: backend
          image: __APPROVED_BACKEND_IMAGE_AT_SHA256__
          env:
            - name: PORT
              value: '8081'
            - name: CINENEST_BIND_ADDRESS
              value: 0.0.0.0
            - name: CINENEST_DB_URL
              value: jdbc:postgresql://ddc7a2d85eb1.18o4rx1o80d5g.us-east1.sql.goog:5432/__APPROVED_DATABASE__?sslmode=verify-full&sslrootcert=/run/secrets/db-ca.pem
            - name: CINENEST_DB_POOL_MAX
              value: '__APPROVED_POOL_MAX__'
            - name: CINENEST_DB_USER
              valueFrom:
                secretKeyRef:
                  name: __APPROVED_DATABASE_USER_SECRET__
                  key: '__PINNED_SECRET_VERSION__'
            - name: CINENEST_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: __APPROVED_DATABASE_PASSWORD_SECRET__
                  key: '__PINNED_SECRET_VERSION__'
          volumeMounts:
            - name: database-ca
              mountPath: /run/secrets
          startupProbe:
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
            httpGet:
              path: /health/ready
              port: 8081
          livenessProbe:
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path: /health/live
              port: 8081
          resources:
            limits:
              cpu: '__APPROVED_BACKEND_CPU__'
              memory: __APPROVED_BACKEND_MEMORY__
      volumes:
        - name: database-ca
          secret:
            secretName: __APPROVED_DATABASE_CA_SECRET__
            items:
              - key: '__PINNED_SECRET_VERSION__'
                path: db-ca.pem

name: CineNest foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.node-version
      - name: Verify toolchain
        run: |
          java -version
          node --version
          test "$(npm --version)" = "11.19.1"
      - name: Backend build, isolated PostgreSQL, architecture, HTTP denial and packaged startup
        run: python3 scripts/verify-foundation.py
      - name: Frontend clean install and verification
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm run lint
          npm test
          npm audit --audit-level=high
      - name: Knowledge and whitespace
        run: |
          python3 knowledge/validate_design_kb.py
          python3 knowledge/execution/validate_execution.py
          git diff --check
